<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crossway Stream Admin Panel</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #ffffff;
    }

    .admin-container {
      max-width: 640px;
      margin: 40px auto;
      text-align: center;
      padding: 0 16px;
    }

    .logo {
      margin-bottom: 24px;
    }

    .logo img {
      width: 220px;
      max-width: 80%;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 24px;
    }

    .url-input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      margin-bottom: 18px;
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 12px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      color: #f9fafb;
    }

    .btn-start {
      background: #111827;
    }

    .btn-pause {
      background: #36667a;
    }

    .btn-end {
      background: #111827;
    }

    .btn-tech {
      background: #4b86a1;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .status {
      margin-top: 16px;
      font-size: 0.9rem;
      color: #374151;
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="logo">
      <img src="https://i.postimg.cc/NGzCCQ35/Untitled-design.png" alt="Crossway Logo">
    </div>

    <h1>Crossway Stream Admin Panel</h1>

    <input
      id="youtubeUrl"
      class="url-input"
      type="text"
      placeholder="Paste YouTube link"
    />

    <button id="btnStart" class="btn btn-start">Start Stream</button>
    <button id="btnPause" class="btn btn-pause">Pause for Sunday School</button>
    <button id="btnEnd"   class="btn btn-end">End Stream</button>
    <button id="btnTech"  class="btn btn-tech">
      Technical Issues Overlay
    </button>

    <div id="status" class="status"></div>
  </div>

  <script>
    const urlInput = document.getElementById("youtubeUrl");
    const statusEl = document.getElementById("status");

    const btnStart = document.getElementById("btnStart");
    const btnPause = document.getElementById("btnPause");
    const btnEnd   = document.getElementById("btnEnd");
    const btnTech  = document.getElementById("btnTech");

    function setStatus(msg) {
      statusEl.textContent = msg || "";
    }

    async function getCurrentState() {
      try {
        const res = await fetch("/api/video", { cache: "no-store" });
        const data = await res.json();
        if (data.embedUrl) {
          urlInput.value = data.embedUrl;
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function sendState(payload) {
      setStatus("Saving...");
      const body = JSON.stringify(payload);

      try {
        await fetch("/api/video", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body
        });
        setStatus("Updated.");
        setTimeout(() => setStatus(""), 2000);
      } catch (e) {
        console.error(e);
        setStatus("Error updating state.");
      }
    }

    btnStart.addEventListener("click", () => {
      const url = urlInput.value.trim();
      if (!url) {
        alert("Please paste a YouTube embed link.");
        return;
      }

      sendState({
        embedUrl: url,
        paused: false,
        ended: false,
        technicalIssue: false
      });
    });

    btnPause.addEventListener("click", () => {
      const url = urlInput.value.trim();
      sendState({
        embedUrl: url,   // keep current video URL
        paused: true,
        ended: false,
        technicalIssue: false
      });
    });

    btnEnd.addEventListener("click", () => {
      sendState({
        embedUrl: "",
        paused: false,
        ended: true,
        technicalIssue: false
      });
    });

    btnTech.addEventListener("click", () => {
      const url = urlInput.value.trim();
      if (!url) {
        alert("You usually want a live video URL before showing the Technical Issues overlay.");
      }

      sendState({
        embedUrl: url,
        paused: false,
        ended: false,
        technicalIssue: true
      });
    });

    // preload current state / fill in URL
    getCurrentState();
  </script>
</body>
</html>
