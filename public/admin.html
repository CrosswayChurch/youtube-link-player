<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Crossway Stream Admin</title>

<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 600px;
    margin: 0 auto;
    padding: 30px;
    text-align: center;
  }

  img.logo {
    width: 240px; /* bigger logo */
    margin-bottom: 20px;
  }

  input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 1rem;
    margin-bottom: 15px;
  }

  button {
    display: block;
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 1rem;
  }

  .save {
    background: #2a2f38; /* black/dark navy */
    color: white;
  }

  .pause-toggle {
    background: #598c9f; /* new blue */
    color: white;
  }

  .clear {
    background: #2a2f38; /* same as Start Stream */
    color: white;
  }

  .back {
    background: #598c9f; /* new blue */
    color: white;
  }

  p.status {
    margin-top: 15px;
    font-weight: 600;
  }
</style>
</head>

<body>

<img class="logo" src="https://i.postimg.cc/NGzCCQ35/Untitled-design.png">

<h2>Crossway Stream Admin Panel</h2>

<input id="url" type="text" placeholder="Paste YouTube link">

<button class="save" id="saveBtn">Start Stream</button>
<button class="pause-toggle" id="pauseBtn">Pause for Sunday School</button>
<button class="clear" id="clearBtn">End Stream</button>
<button class="back" onclick="location.href='https://www.crossway-fellowship.org/live-streams'">Back to Live Stream</button>

<p class="status" id="status"></p>

<script>
function toEmbed(raw) {
  try {
    const u = new URL(raw);
    if (u.hostname.includes("youtu")) {
      const id =
        u.searchParams.get("v") ||
        u.pathname.split("/").pop();
      // Autoplay embed
      return "https://www.youtube.com/embed/" + id + "?autoplay=1";
    }
  } catch {}
  return raw;
}

function setPauseButtonState(isPaused) {
  const btn = document.getElementById("pauseBtn");
  btn.dataset.paused = isPaused ? "true" : "false";
  btn.textContent = isPaused ? "Resume Live Stream" : "Pause for Sunday School";
}

async function load() {
  const res = await fetch("/api/video");
  const data = await res.json();

  document.getElementById("url").value = data.embedUrl || "";
  setPauseButtonState(!!data.paused);
}

document.getElementById("saveBtn").onclick = async () => {
  const raw = document.getElementById("url").value.trim();
  const embed = raw ? toEmbed(raw) : "";

  await fetch("/api/video", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ embedUrl: embed })
  });

  document.getElementById("status").textContent =
    "Live Stream Started";
};

document.getElementById("clearBtn").onclick = async () => {
  await fetch("/api/video", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    // Clear link AND mark as ended
    body: JSON.stringify({ embedUrl: "", ended: true })
  });

  document.getElementById("url").value = "";
  document.getElementById("status").textContent =
    "Live Stream Ended";
};

document.getElementById("pauseBtn").onclick = async () => {
  const btn = document.getElementById("pauseBtn");
  const currentlyPaused = btn.dataset.paused === "true";
  const newPaused = !currentlyPaused;

  await fetch("/api/pause", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ paused: newPaused })
  });

  setPauseButtonState(newPaused);

  const status = document.getElementById("status");
  status.textContent = newPaused
    ? 'Live Stream Paused for Sunday School'
    : "Live stream Started Again";
};

load();
</script>

</body>
</html>
