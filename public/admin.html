<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Crossway Stream Admin</title>

<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 600px;
    margin: 0 auto;
    padding: 30px;
    text-align: center;
  }

  img.logo {
    width: 180px;
    margin-bottom: 20px;
  }

  input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 1rem;
    margin-bottom: 15px;
  }

  button {
    display: block;
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 1rem;
  }

  .save {
    background: #2a2f38;
    color: white;
  }

  .pause-toggle {
    background: #f39c12; /* orange-ish for status */
    color: white;
  }

  .clear {
    background: #c0392b;
    color: white;
  }

  .back {
    background: #5da9c7;
    color: white;
  }

  p.status {
    margin-top: 15px;
    font-weight: 600;
  }
</style>
</head>

<body>

<img class="logo" src="https://i.postimg.cc/NGzCCQ35/Untitled-design.png">

<h2>Update Live Stream</h2>

<input id="url" type="text" placeholder="Paste YouTube link">

<button class="save" id="saveBtn">Save Stream Link</button>
<button class="pause-toggle" id="pauseBtn">Pause for Sunday School</button>
<button class="clear" id="clearBtn">Clear Link</button>
<button class="back" onclick="location.href='https://www.crossway-fellowship.org/live-streams'">Back to Live Stream</button>

<p class="status" id="status"></p>

<script>
function toEmbed(raw) {
  try {
    const u = new URL(raw);
    if (u.hostname.includes("youtu")) {
      const id =
        u.searchParams.get("v") ||
        u.pathname.split("/").pop();
      return "https://www.youtube.com/embed/" + id;
    }
  } catch {}
  return raw;
}

function setPauseButtonState(isPaused) {
  const btn = document.getElementById("pauseBtn");
  btn.dataset.paused = isPaused ? "true" : "false";

  if (isPaused) {
    btn.textContent = "Resume Live Stream";
  } else {
    btn.textContent = "Pause for Sunday School";
  }
}

async function load() {
  const res = await fetch("/api/video");
  const data = await res.json();

  document.getElementById("url").value = data.embedUrl || "";

  // If backend returns a paused flag, use it; otherwise default to false
  const paused = !!data.paused;
  setPauseButtonState(paused);
}

document.getElementById("saveBtn").onclick = async () => {
  const raw = document.getElementById("url").value.trim();
  const embed = raw ? toEmbed(raw) : "";

  await fetch("/api/video", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ embedUrl: embed })
  });

  document.getElementById("status").textContent = "Saved!";
};

document.getElementById("clearBtn").onclick = async () => {
  await fetch("/api/video", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ embedUrl: "" })
  });

  document.getElementById("url").value = "";
  document.getElementById("status").textContent = "Link cleared!";
};

document.getElementById("pauseBtn").onclick = async () => {
  const btn = document.getElementById("pauseBtn");
  const currentlyPaused = btn.dataset.paused === "true";
  const newPaused = !currentlyPaused;

  await fetch("/api/pause", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ paused: newPaused })
  });

  setPauseButtonState(newPaused);

  const status = document.getElementById("status");
  status.textContent = newPaused
    ? 'Live stream is marked as "paused for Sunday School".'
    : "Live stream is active again.";
};

load();
</script>

</body>
</html>
