<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Live Stream Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .message {
      color: #fff;
      font-family: system-ui, sans-serif;
      padding: 20px;
      font-size: 1.2rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="video-wrapper">
    <iframe
      id="player"
      src=""
      allowfullscreen
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
    </iframe>
  </div>

  <script>
    async function loadVideo() {
      try {
        const res = await fetch("/api/video");
        const data = await res.json();
        const iframe = document.getElementById("player");

        // No link = show message
        if (!data.embedUrl || data.embedUrl.trim() === "") {
          document.body.innerHTML =
            '<div class="message">No live stream set</div>';
          return;
        }

        iframe.src = data.embedUrl;
      } catch (err) {
        console.error(err);
        document.body.innerHTML =
          '<div class="message">Error loading live stream</div>';
      }
    }

    loadVideo();
  </script>
</body>
</html>
