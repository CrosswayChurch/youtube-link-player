<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Embedded YouTube Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .message {
      color: #fff;
      font-family: system-ui, sans-serif;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div class="video-wrapper">
    <iframe id="player"
      src=""
      allowfullscreen
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
    </iframe>
  </div>

  <script>
    async function loadVideo() {
      try {
        const res = await fetch("/api/video");
        const data = await res.json();
        const iframe = document.getElementById("player");
        if (data.embedUrl) {
          iframe.src = data.embedUrl;
        } else {
          document.body.innerHTML =
            '<div class="message">No video set yet.</div>';
        }
      } catch (err) {
        console.error(err);
        document.body.innerHTML =
          '<div class="message">Error loading video.</div>';
      }
    }
    loadVideo();
  </script>
</body>
</html>
