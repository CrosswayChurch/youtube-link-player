<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Stream Player</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #fff; 
      font-family: Arial, sans-serif;
    }

    /* VIDEO WRAPPER */
    .video-wrapper {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: none;
    }

    .video-wrapper iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* EMPTY STATE */
    .empty-state, .pause-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      text-align: center;
      padding: 2rem;
    }

    .empty-state img,
    .pause-screen img {
      width: 320px;       /* bigger logo */
      max-width: 80%;
      margin-bottom: 30px;
    }

    .empty-state p,
    .pause-screen p {
      font-size: 1.8rem;      /* bigger text */
      font-weight: 700;
      color: #222;
      margin: 0;
      margin-bottom: 10px;
    }

    .pause-screen small {
      font-size: 1.2rem;
      color: #555;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- PAUSED SCREEN -->
  <div id="pauseScreen" class="pause-screen" style="display:none;">
    <img src="https://i.postimg.cc/NGzCCQ35/Untitled-design.png" alt="Crossway Logo">
    <p>Live stream is paused for Sunday School</p>
    <small>Please check back after class.</small>
  </div>

  <!-- NOT STARTED SCREEN -->
  <div id="emptyState" class="empty-state">
    <img src="https://i.postimg.cc/NGzCCQ35/Untitled-design.png" alt="Crossway Logo">
    <p>Live stream has not started yet.<br>Please check back later.</p>
  </div>

  <!-- LIVE VIDEO -->
  <div id="videoWrapper" class="video-wrapper">
    <iframe id="player" src="" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
  </div>

  <script>
    async function loadVideo() {
      try {
        const res = await fetch("/api/video");
        const data = await res.json();

        const url = data.embedUrl || "";
        const paused = !!data.paused;

        const video = document.getElementById("videoWrapper");
        const empty = document.getElementById("emptyState");
        const pausedScreen = document.getElementById("pauseScreen");
        const iframe = document.getElementById("player");

        if (paused) {
          // Show pause screen
          pausedScreen.style.display = "flex";
          empty.style.display = "none";
          video.style.display = "none";
          return;
        }

        if (url.trim() === "") {
          // Show "not started yet" screen
          pausedScreen.style.display = "none";
          empty.style.display = "flex";
          video.style.display = "none";
        } else {
          // Show video
          iframe.src = url;
          pausedScreen.style.display = "none";
          empty.style.display = "none";
          video.style.display = "block";
        }
      } catch (err) {
        console.error("Error loading video:", err);
      }
    }

    loadVideo();
  </script>

</body>
</html>
