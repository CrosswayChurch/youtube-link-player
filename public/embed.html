<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Stream Player</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #fff; 
      font-family: Arial, sans-serif;
    }

    .video-wrapper {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: none; /* Hidden unless a live stream exists */
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      text-align: center;
      padding: 1rem;
    }

    .empty-state img {
      width: 260px;
      max-width: 70%;
      margin-bottom: 20px;
    }

    .empty-state p {
      font-size: 1.3rem;
      font-weight: 600;
      color: #222;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- DEFAULT (shown first) -->
  <div id="emptyState" class="empty-state">
    <img src="https://i.postimg.cc/NGzCCQ35/Untitled-design.png" alt="Crossway Logo">
    <p>Live stream has not started yet.<br>Please check back later.</p>
  </div>

  <!-- VIDEO PLAYER -->
  <div id="videoWrapper" class="video-wrapper">
    <iframe id="player" src="" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
  </div>

  <script>
    async function loadVideo() {
      try {
        const res = await fetch("/api/video");
        const data = await res.json();
        const url = data.embedUrl || "";

        const video = document.getElementById("videoWrapper");
        const empty = document.getElementById("emptyState");
        const iframe = document.getElementById("player");

        if (url.trim() === "") {
          // No video set → show empty state
          empty.style.display = "flex";
          video.style.display = "none";
        } else {
          // Video exists → show player
          iframe.src = url;
          empty.style.display = "none";
          video.style.display = "block";
        }
      } catch (err) {
        console.error("Error loading video:", err);
      }
    }

    loadVideo();
  </script>

</body>
</html>
